name: Manual legacy Fly.io deploy

on:
  workflow_dispatch:

concurrency:
  group: fly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mandatory ephemeris dependency
        run: pip install -r requirements.txt

      - name: Run core test suite
        run: |
          python3 tests/test_pythagorean.py
          python3 tests/test_extended.py
          python3 tests/test_final.py
          python3 tests/test_analytics.py
          python3 tests/test_symbolic_roadmap.py
          python3 tests/test_unicode_pipeline_integration.py
          python3 tests/test_integrated_prototypes.py
          python3 tests/test_symbolic_contract.py
          python3 tests/test_web_symbolic_surface.py
          python3 tests/test_ephemeris_packaging.py
          python3 tests/test_birth_validation.py
          python3 tests/test_reference_population.py
          python3 tests/test_web_hardening.py
          python3 tests/test_api_birth_contract.py
          python3 tests/test_build_revision.py
          python3 tests/test_sigil.py
          python3 tests/test_accuracy_hardening.py
      - name: Run constellation and evidence tests
        run: python3 tests/test_constellation_evidence.py
      - name: Run custom sigil tests
        run: |
          python3 tests/test_custom_sigil.py
          python3 tests/test_sigil_api.py
      - name: Run True Human Design tests
        run: |
          python3 tests/test_true_human_design_core.py
          python3 tests/test_true_human_design_engine.py
          python3 tests/test_true_human_design_mutations.py
          python3 tests/test_true_human_design_cli.py

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
