name: Test and Deploy Fly.io API

on:
  pull_request:
    paths:
      - "src/**"
      - "webapp/**"
      - "tests/**"
      - "scripts/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/fly-deploy.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "webapp/**"
      - "tests/**"
      - "scripts/**"
      - "requirements.txt"
      - "Dockerfile"
      - "fly.toml"
      - ".github/workflows/fly-deploy.yml"
  workflow_dispatch:

concurrency:
  group: fly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mandatory ephemeris dependency
        run: pip install -r requirements.txt

      - name: Run existing test suite
        run: |
          python3 tests/test_pythagorean.py
          python3 tests/test_extended.py
          python3 tests/test_final.py
          python3 tests/test_analytics.py
          python3 tests/test_symbolic_roadmap.py
          python3 tests/test_unicode_pipeline_integration.py
          python3 tests/test_integrated_prototypes.py
          python3 tests/test_symbolic_contract.py
          python3 tests/test_web_symbolic_surface.py
          python3 tests/test_ephemeris_packaging.py
          python3 tests/test_accuracy_hardening.py

      - name: Run True Human Design core tests
        run: python3 tests/test_true_human_design_core.py

      - name: Run True Human Design engine tests
        run: python3 tests/test_true_human_design_engine.py

      - name: Run True Human Design mutation guards
        run: python3 tests/test_true_human_design_mutations.py

      - name: Run True Human Design CLI tests
        run: python3 tests/test_true_human_design_cli.py

      - name: Set up Flyctl
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
