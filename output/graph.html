<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Identity Network Graph</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; font-family: 'SF Mono', monospace; color: #fff; overflow: hidden; }
canvas { display: block; }
#info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 12px; border-radius: 6px; border: 1px solid #333; font-size: 11px; }
#info h3 { color: #4fc3f7; margin-bottom: 4px; font-size: 13px; }
#tooltip { position: absolute; display: none; background: rgba(0,0,0,0.9); padding: 8px 12px; border-radius: 4px; border: 1px solid #4fc3f7; font-size: 11px; pointer-events: none; }
</style>
</head>
<body>
<div id="info">
  <h3>Identity Network</h3>
  <p>19 nodes, 25 edges</p>
  <p>Drag to move. Scroll to zoom. Hover for details.</p>
</div>
<div id="tooltip"></div>
<canvas id="canvas"></canvas>
<script>
const nodes = [{"id": "human:kirk_evan_brown", "label": "human:kirk_evan_brown", "resonance": 50}, {"id": "identity:birth:kirk_evan_brown", "label": "identity:birth:kirk_evan_brown", "resonance": 50}, {"id": "identity:alias:capt", "label": "identity:alias:capt", "resonance": 50}, {"id": "identity:alias:captain", "label": "identity:alias:captain", "resonance": 50}, {"id": "identity:handle:knowurknot", "label": "identity:handle:knowurknot", "resonance": 50}, {"id": "identity:persona:captain_knowurknot", "label": "identity:persona:captain_knowurknot", "resonance": 50}, {"id": "identity:handle:knowurknottty", "label": "identity:handle:knowurknottty", "resonance": 50}, {"id": "identity:alias:jenn", "label": "identity:alias:jenn", "resonance": 50}, {"id": "project:capt", "label": "project:capt", "resonance": 50}, {"id": "project:biocapt", "label": "project:biocapt", "resonance": 50}, {"id": "project:frankencapt", "label": "project:frankencapt", "resonance": 50}, {"id": "project:jennai", "label": "project:jennai", "resonance": 50}, {"id": "project:synsync", "label": "project:synsync", "resonance": 50}, {"id": "project:inversion_labs", "label": "project:inversion_labs", "resonance": 50}, {"id": "project:knowledge_bubbles", "label": "project:knowledge_bubbles", "resonance": 50}, {"id": "project:soul_fractal_engine", "label": "project:soul_fractal_engine", "resonance": 50}, {"id": "project:wyrd", "label": "project:wyrd", "resonance": 50}, {"id": "project:capt_rys", "label": "project:capt_rys", "resonance": 50}, {"id": "project:syncchef", "label": "project:syncchef", "resonance": 50}];
const edges = [{"source": "human:kirk_evan_brown", "target": "identity:birth:kirk_evan_brown", "weight": 0.5}, {"source": "human:kirk_evan_brown", "target": "identity:alias:capt", "weight": 0.5}, {"source": "human:kirk_evan_brown", "target": "identity:alias:captain", "weight": 0.5}, {"source": "human:kirk_evan_brown", "target": "identity:handle:knowurknot", "weight": 0.5}, {"source": "human:kirk_evan_brown", "target": "identity:persona:captain_knowurknot", "weight": 0.5}, {"source": "human:kirk_evan_brown", "target": "identity:handle:knowurknottty", "weight": 0.5}, {"source": "human:kirk_evan_brown", "target": "identity:alias:jenn", "weight": 0.5}, {"source": "human:kirk_evan_brown", "target": "project:capt", "weight": 0.5}, {"source": "human:kirk_evan_brown", "target": "project:biocapt", "weight": 0.5}, {"source": "human:kirk_evan_brown", "target": "project:frankencapt", "weight": 0.5}, {"source": "human:kirk_evan_brown", "target": "project:jennai", "weight": 0.5}, {"source": "human:kirk_evan_brown", "target": "project:synsync", "weight": 0.5}, {"source": "human:kirk_evan_brown", "target": "project:inversion_labs", "weight": 0.5}, {"source": "identity:alias:capt", "target": "project:capt", "weight": 0.5}, {"source": "identity:handle:knowurknot", "target": "project:inversion_labs", "weight": 0.5}, {"source": "identity:alias:captain", "target": "project:capt", "weight": 0.5}, {"source": "identity:alias:jenn", "target": "project:jennai", "weight": 0.5}, {"source": "project:capt", "target": "project:biocapt", "weight": 0.5}, {"source": "project:capt", "target": "project:frankencapt", "weight": 0.5}, {"source": "project:biocapt", "target": "project:frankencapt", "weight": 0.5}, {"source": "project:synsync", "target": "project:capt", "weight": 0.5}, {"source": "project:inversion_labs", "target": "project:capt", "weight": 0.5}, {"source": "project:knowledge_bubbles", "target": "project:capt", "weight": 0.5}, {"source": "project:wyrd", "target": "identity:handle:knowurknot", "weight": 0.5}, {"source": "project:soul_fractal_engine", "target": "project:biocapt", "weight": 0.5}];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

let W, H, scale = 1, offsetX = 0, offsetY = 0;
let dragging = null, dragStart = {x: 0, y: 0};
let mouseX = 0, mouseY = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Initialize positions in circle
const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.35;
nodes.forEach((n, i) => {
  const angle = (2 * Math.PI * i) / nodes.length;
  n.x = cx + R * Math.cos(angle);
  n.y = cy + R * Math.sin(angle);
  n.vx = 0;
  n.vy = 0;
});

function getNode(id) { return nodes.find(n => n.id === id); }

function tick() {
  // Simple force simulation
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[j].x - nodes[i].x;
      const dy = nodes[j].y - nodes[i].y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const force = 2000 / (d * d);
      nodes[i].vx -= (dx / d) * force;
      nodes[i].vy -= (dy / d) * force;
      nodes[j].vx += (dx / d) * force;
      nodes[j].vy += (dy / d) * force;
    }
  }
  // Edge attraction
  edges.forEach(e => {
    const a = getNode(e.source), b = getNode(e.target);
    if (!a || !b) return;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const force = (d - 100) * 0.01 * e.weight;
    a.vx += (dx / d) * force;
    a.vy += (dy / d) * force;
    b.vx -= (dx / d) * force;
    b.vy -= (dy / d) * force;
  });
  // Center gravity
  nodes.forEach(n => {
    n.vx += (W/2 - n.x) * 0.001;
    n.vy += (H/2 - n.y) * 0.001;
    n.vx *= 0.9;
    n.vy *= 0.9;
    if (n !== dragging) {
      n.x += n.vx;
      n.y += n.vy;
    }
  });
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  // Draw edges
  edges.forEach(e => {
    const a = getNode(e.source), b = getNode(e.target);
    if (!a || !b) return;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = `rgba(79, 195, 247, ${e.weight * 0.3})`;
    ctx.lineWidth = e.weight * 2;
    ctx.stroke();
  });

  // Draw nodes
  nodes.forEach(n => {
    const r = 8 + (n.resonance || 50) / 10;
    const hue = ((n.resonance || 50) / 100) * 120 + 180;
    ctx.beginPath();
    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fillStyle = `hsl(${hue}, 70%, 50%)`;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = '#ccc';
    ctx.font = '9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(n.label, n.x, n.y - r - 4);
  });

  ctx.restore();
}

function loop() {
  tick();
  draw();
  requestAnimationFrame(loop);
}
loop();

// Interaction
canvas.addEventListener('mousedown', e => {
  const mx = (e.clientX - offsetX) / scale;
  const my = (e.clientY - offsetY) / scale;
  dragging = nodes.find(n => Math.hypot(n.x - mx, n.y - my) < 20);
  if (dragging) { dragStart = {x: mx - dragging.x, y: my - dragging.y}; }
});

canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  if (dragging) {
    const mx = (e.clientX - offsetX) / scale;
    const my = (e.clientY - offsetY) / scale;
    dragging.x = mx - dragStart.x;
    dragging.y = my - dragStart.y;
    dragging.vx = 0; dragging.vy = 0;
  }
  // Tooltip
  const mx = (e.clientX - offsetX) / scale;
  const my = (e.clientY - offsetY) / scale;
  const hover = nodes.find(n => Math.hypot(n.x - mx, n.y - my) < 20);
  if (hover) {
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top = (e.clientY + 12) + 'px';
    tooltip.innerHTML = `<b>${hover.label}</b><br>Resonance: ${(hover.resonance || 0).toFixed(1)}`;
  } else {
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('mouseup', () => { dragging = null; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  scale *= factor;
  offsetX = mouseX - (mouseX - offsetX) * factor;
  offsetY = mouseY - (mouseY - offsetY) * factor;
});
</script>
</body>
</html>
